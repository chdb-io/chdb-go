name: chDB-go

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/.md'
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/.md'

jobs:
  build_linux:
    runs-on: ubuntu-latest
    # The durable suite's end-to-end tests need the management ABI. They skip
    # without it, so that a developer on an older libchdb is not shown failures
    # for it — but here the engine is whatever CHDB_ENGINE_PIN names, so a skip
    # does not mean "this machine has an old libchdb", it means the job did not
    # install the engine it was told to. lib.chdb.io retries a failed download
    # against releases/latest, which is one way to get there and not the only
    # one. This turns any of them into a failed job rather than a green one
    # that tested nothing.
    env:
      CHDB_REQUIRE_DURABLE_ABI: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Fetch library
      run: |
          make install
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Build
      run: |
          go mod tidy
          make build
    - name: Test
      run: make test
    - name: Test with race detector
      run: go test -race -timeout=180s ./...
    - name: Test main
      run: ./chdb-go "SELECT 12345"

  build_mac:
    runs-on: macos-14
    # The durable suite's end-to-end tests need the management ABI. They skip
    # without it, so that a developer on an older libchdb is not shown failures
    # for it — but here the engine is whatever CHDB_ENGINE_PIN names, so a skip
    # does not mean "this machine has an old libchdb", it means the job did not
    # install the engine it was told to. lib.chdb.io retries a failed download
    # against releases/latest, which is one way to get there and not the only
    # one. This turns any of them into a failed job rather than a green one
    # that tested nothing.
    env:
      CHDB_REQUIRE_DURABLE_ABI: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Fetch library
      run: |
          make install
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Build
      run: |
          go mod tidy
          make build
    - name: Test
      run: make test
    - name: Test with race detector
      run: go test -race -timeout=180s ./...
    - name: Test main
      run: ./chdb-go "SELECT 12345"

  # Building and testing inside the repository does not prove that what users
  # download works. This job packages the commit the way the module proxy does
  # and consumes it from outside the repository, which catches a build that
  # needs an uncommitted file or that embeds a path from the build machine.
  consume_as_published_module:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Consume as a published module
      run: .github/scripts/verify-as-user.sh

  # Verifies the path users get once the per-platform engine modules are
  # published: package the engine, build a program that carries it, and run it
  # with nothing installed on the machine.
  #
  # Only two of the four published platforms are covered here, because these are
  # the runner labels that are reliably available. linux-arm64 and darwin-amd64
  # are packaged by the same script and checked at release time.
  embedded_engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Carry the engine in the binary
      run: .github/scripts/verify-embedded-engine.sh
