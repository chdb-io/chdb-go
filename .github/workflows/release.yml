name: chDB-go Release

on:
  release:
    types: [created]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fetch library
      run: |
          make install
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Build
      run: |
          go mod tidy
          make build 
    - name: Test
      run: ./chdb-go "SELECT 12345"
    - name: Get Version
      run: |
        echo "VERSION=${{  github.ref_name }}" >> $GITHUB_ENV
    - name: Upload chdb-go and libchdb.so to release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cp -a /usr/local/lib/libchdb.so .
        tar -czvf linux-x86_64-chdb-go.tar.gz libchdb.so chdb-go
        gh release upload ${{ github.ref_name }} linux-x86_64-chdb-go.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.ACTION }}

  # macos-15: the macos-13 and macos-14 labels have been retired, and a job
  # asking for a retired label never runs. A macos-13 job waited for a runner
  # until the 24 hour limit and was then cancelled, which is what happened to
  # the v2.0.0 and v2.0.1 releases: they published no macOS artifact at all. A
  # macos-14 job is cancelled at once ("The configuration
  # 'macos-14-arm64-us-default' is not supported").
  #
  # macos-15 is arm64, so what this job produces is an arm64 artifact and is
  # named accordingly. Publishing it under the old macos-x86_64 name would ship
  # a binary for the wrong architecture under a name users match on, which is
  # worse than not publishing it.
  build_mac:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Fetch library
      run: |
          make install
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"
    - name: Build
      run: |
          go mod tidy
          make build
    - name: Test
      run: ./chdb-go "SELECT 12345"
    - name: Get Version
      run: |
        echo "VERSION=${{  github.ref_name }}" >> $GITHUB_ENV
    - name: Upload chdb-go and libchdb.so to release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cp -a /usr/local/lib/libchdb.so .
        tar -czvf macos-arm64-chdb-go.tar.gz libchdb.so chdb-go
        gh release upload ${{ github.ref_name }} macos-arm64-chdb-go.tar.gz --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.ACTION }}
